<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Helvetica, Arial, sans-serif"><defs><marker id="head-1d2733" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="head-d9482b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9482b"/></marker><marker id="head-2f6f73" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6f73"/></marker><marker id="head-2b59c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b59c3"/></marker><marker id="head-5b6875" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6875"/></marker><marker id="head-d98a00" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d98a00"/></marker></defs><rect width="960" height="540" fill="#fbfaf7"/><rect x="40" y="26" width="117.60000000000001" height="30" rx="6" fill="#1d2733"/><text x="52" y="47" font-size="15" fill="#fff" text-anchor="start" font-weight="700" >STATEMENT</text><text x="920" y="46" font-size="15" fill="#5b6875" text-anchor="end" font-weight="400" >Part 2 · the induction hypothesis</text><rect x="40" y="136" width="880" height="142" rx="10" fill="#fff" stroke="#1d2733" stroke-width="3"/><text x="64" y="174" font-size="25" fill="#1d2733" text-anchor="start" font-weight="700" >Main lemma</text><text x="64" y="216" font-size="21" fill="#5b6875" text-anchor="start" font-weight="700" >Assume:</text><text x="160" y="216" font-size="21" fill="#1d2733" text-anchor="start" font-weight="400" >k ≥ 6, and at step m = 7<tspan baseline-shift="super" font-size="70%">k</tspan> the walk is in the table state for k.</text><text x="64" y="254" font-size="21" fill="#5b6875" text-anchor="start" font-weight="700" >Show:</text><text x="160" y="254" font-size="21" fill="#1d2733" text-anchor="start" font-weight="700" >at step 7m it is in the table state for k + 1.</text><text x="64" y="322" font-size="17" fill="#5b6875" text-anchor="start" font-weight="700" >to prove</text><circle cx="78" cy="355" r="15" fill="#1d2733"/><text x="78" y="361.12" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >1</text><text x="108" y="362" font-size="22" fill="#1d2733" text-anchor="start" font-weight="400" >every choice is the choice of the original rule</text><circle cx="78" cy="397" r="15" fill="#1d2733"/><text x="78" y="403.12" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >2</text><text x="108" y="404" font-size="22" fill="#1d2733" text-anchor="start" font-weight="400" >exactly 6m steps</text><circle cx="78" cy="439" r="15" fill="#1d2733"/><text x="78" y="445.12" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >3</text><text x="108" y="446" font-size="22" fill="#1d2733" text-anchor="start" font-weight="700" >at the end: exactly the table state for k + 1</text></svg>
