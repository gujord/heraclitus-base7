hor="start" font-weight="700" >whose P choices have P different remainders modulo P</text><text x="64" y="250" font-size="15" fill="#5b6875" text-anchor="start" font-weight="700" >SHOW</text><text x="160" y="250" font-size="22" fill="#1d2733" text-anchor="start" font-weight="700" >the cycle repeats for ever:</text><text x="160" y="284" font-size="22" fill="#1d2733" text-anchor="start" font-weight="700" >in every later round, the choices of the first round,</text><text x="160" y="318" font-size="22" fill="#1d2733" text-anchor="start" font-weight="700" >moved by P each round</text><text x="480" y="404" font-size="23" fill="#1d2733" text-anchor="middle" font-weight="700" >cycle lengths in the proof:  1, 4, 8, 74, 130</text></svg>
