ze="22" fill="#1d2733" text-anchor="start" font-weight="400" >all checked:</text><text x="160" y="242" font-size="22" fill="#1d2733" text-anchor="start" font-weight="400" >1   its word at the bottom</text><text x="160" y="278" font-size="22" fill="#1d2733" text-anchor="start" font-weight="400" >2   every transfer of its layers, until the pair comes back</text><text x="160" y="314" font-size="22" fill="#1d2733" text-anchor="start" font-weight="400" >3   the pair comes back to an earlier pair</text><text x="40" y="360" font-size="15" fill="#5b6875" text-anchor="start" font-weight="700" letter-spacing="1.2">SHOW</text><text x="160" y="360" font-size="22" fill="#1d2733" text-anchor="start" font-weight="400" >the marker record at the top of the ladder is determined,</text><text x="160" y="396" font-size="22" fill="#1d2733" text-anchor="start" font-weight="400" >from whatever power of seven ≥ 2 401 the walk came down</text><rect x="22" y="62" width="916" height="356" rx="12" fill="none" stroke="#1d2733" stroke-width="3"/></svg>
