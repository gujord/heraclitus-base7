<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Helvetica, Arial, sans-serif"><defs><marker id="head-1d2733" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="head-d9482b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9482b"/></marker><marker id="head-2f6f73" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6f73"/></marker><marker id="head-2b59c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b59c3"/></marker><marker id="head-5b6875" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6875"/></marker><marker id="head-d98a00" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d98a00"/></marker></defs><rect width="960" height="540" fill="#fbfaf7"/><rect x="40" y="26" width="117.60000000000001" height="30" rx="6" fill="#1d2733"/><text x="52" y="47" font-size="15" fill="#fff" text-anchor="start" font-weight="700" >STATEMENT</text><text x="920" y="46" font-size="15" fill="#5b6875" text-anchor="end" font-weight="400" >Part 1 · the claim</text><rect x="100" y="110" width="760" height="236" rx="10" fill="#fff" stroke="#1d2733" stroke-width="3"/><text x="130" y="156" font-size="27" fill="#1d2733" text-anchor="start" font-weight="700" >Proposed theorem</text><text x="130" y="204" font-size="25" fill="#1d2733" text-anchor="start" font-weight="400" >For every k ≥ 6, every integer from</text><text x="130" y="244" font-size="25" fill="#1d2733" text-anchor="start" font-weight="700" >−C<tspan baseline-shift="sub" font-size="70%">k</tspan> + 37  to  C<tspan baseline-shift="sub" font-size="70%">k</tspan> − 37</text><text x="130" y="284" font-size="25" fill="#1d2733" text-anchor="start" font-weight="400" >is among a(0), a(1), …, a(7<tspan baseline-shift="super" font-size="70%">k</tspan>).</text><rect x="130" y="300" width="446" height="32" rx="6" fill="#fde9e3" stroke="#d9482b" stroke-width="2"/><text x="142" y="322" font-size="18" fill="#1d2733" text-anchor="start" font-weight="700" >proposed: not yet reviewed by a mathematician</text><text x="480" y="396" font-size="25" fill="#1d2733" text-anchor="middle" font-weight="700" >So every integer is a(n) for exactly one n.</text></svg>
